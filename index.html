<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio Online — ZapComanda</title>
  <meta name="theme-color" content="#E63946">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #E63946;
      --bg: #f8f8f8;
      --surface: #ffffff;
      --border: #eee;
      --text: #1a1a1a;
      --text2: #666;
      --radius: 14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 100px;
    }

    /* HEADER */
    .header {
      background: var(--accent);
      color: #fff;
      padding: 28px 20px 20px;
      text-align: center;
      position: relative;
    }

    .header-logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 12px;
      overflow: hidden;
    }

    .header-logo img { width: 100%; height: 100%; object-fit: cover; }

    .header h1 { font-size: 1.4rem; font-weight: 700; }
    .header-endereco { font-size: 0.82rem; opacity: 0.85; margin-top: 6px; }

    .status-aberto {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-top: 10px;
    }
    .status-aberto::before { content: '●'; font-size: 0.6rem; color: #2ecc71; }
    .status-fechado::before { content: '●'; font-size: 0.6rem; color: #e74c3c; }

    /* CATEGORIAS NAV */
    .cats-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 0;
      overflow-x: auto;
      position: sticky;
      top: 0;
      z-index: 50;
      scrollbar-width: none;
    }
    .cats-nav::-webkit-scrollbar { display: none; }

    .cat-btn {
      background: none;
      border: none;
      color: var(--text2);
      padding: 12px 16px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: color 0.15s;
    }
    .cat-btn.ativo { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

    /* SEÇÕES */
    .secao { padding: 20px 16px 0; }
    .secao-titulo {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .secao-titulo::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* CARDS DE ITEM */
    .item-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .item-info { flex: 1; }
    .item-nome { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
    .item-desc { font-size: 0.8rem; color: var(--text2); line-height: 1.4; }
    .item-preco {
      font-weight: 700;
      color: var(--accent);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .item-indisponivel { opacity: 0.45; }
    .item-indisponivel .item-preco::after { content: ' · Indisponível'; font-size: 0.75rem; color: var(--text2); font-weight: 400; }

    /* TAMANHOS (pizzaria) */
    .tamanhos-lista { margin-top: 8px; }
    .tamanho-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      padding: 3px 0;
      color: var(--text2);
    }
    .tamanho-row span:last-child { font-weight: 600; color: var(--accent); }

    /* CTA WHATSAPP */
    .cta-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-decoration: none;
    }

    .btn-whatsapp:hover { opacity: 0.9; }

    .cta-info { text-align: center; font-size: 0.78rem; color: var(--text2); }

    /* LOADING */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 40vh;
      color: var(--text2);
      gap: 12px;
    }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fechado-banner {
      background: #fff3f3;
      border: 1px solid #fcc;
      border-radius: var(--radius);
      padding: 16px;
      margin: 16px;
      text-align: center;
      color: #c00;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div id="conteudo">
  <div class="loading">
    <div class="spinner"></div>
    <span>Carregando cardápio...</span>
  </div>
</div>

<script>
// ⬇ Troque aqui quando definir o nome da marca
const MARCA = 'ZapComanda';

const SUPABASE_URL = 'https://ukyalvcrtanuvldilbdb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVreWFsdmNydGFudXZsZGlsYmRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDIzOTksImV4cCI6MjA5MTUxODM5OX0.5lXRGURsAQ5ubvmoWsmgjpw6hyYAtffTmMkZU4eX21Y';

async function sb(tabela, params = {}) {
  const url = new URL(`${SUPABASE_URL}/rest/v1/${tabela}`);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const r = await fetch(url, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  return r.json();
}

// Pega o ?slug= ou ?id= da URL
const params = new URLSearchParams(location.search);
const instanceName = params.get('slug') || params.get('instance') || 'bella_vista';

async function main() {
  try {
    // Carrega negócio
    const negocios = await sb('negocios', { instance_name: `eq.${instanceName}`, select: '*' });
    if (!negocios.length) {
      document.getElementById('conteudo').innerHTML = '<div class="loading">Estabelecimento não encontrado.</div>';
      return;
    }
    const neg = negocios[0];

    // Carrega dados do cardápio em paralelo
    const [categorias, sabores, produtos, tamanhos, bordas] = await Promise.all([
      sb('categorias', { negocio_id: `eq.${neg.id}`, ativo: 'eq.true', order: 'ordem.asc', select: '*' }),
      sb('sabores', { negocio_id: `eq.${neg.id}`, select: '*', order: 'nome.asc' }),
      sb('produtos', { negocio_id: `eq.${neg.id}`, select: '*', order: 'codigo.asc' }),
      sb('tamanhos', { negocio_id: `eq.${neg.id}`, ativo: 'eq.true', order: 'ordem.asc', select: '*' }),
      sb('bordas', { negocio_id: `eq.${neg.id}`, select: '*' })
    ]);

    renderPage(neg, categorias, sabores, produtos, tamanhos, bordas);
  } catch (e) {
    document.getElementById('conteudo').innerHTML = '<div class="loading">Erro ao carregar. Tente novamente.</div>';
  }
}

function estaAberto(neg) {
  const dias = ['dom','seg','ter','qua','qui','sex','sab'];
  const agora = new Date();
  const diaKey = dias[agora.getDay()];
  const horarios = neg.horarios || {};
  const h = horarios[diaKey];
  if (!h || !h.ativo) return false;
  const hora = agora.getHours() * 60 + agora.getMinutes();
  const [ha, ma] = (h.abre || '00:00').split(':').map(Number);
  const [hf, mf] = (h.fecha || '23:59').split(':').map(Number);
  return hora >= ha * 60 + ma && hora <= hf * 60 + mf;
}

function formatarPreco(v) {
  return 'R$ ' + parseFloat(v).toFixed(2).replace('.', ',');
}

function renderPage(neg, categorias, sabores, produtos, tamanhos, bordas) {
  const aberto = estaAberto(neg);
  const modulos = neg.modulos || {};

  // Agrupa sabores por categoria
  const saboresPorCat = {};
  sabores.forEach(s => {
    const cid = s.categoria_id || 'sem';
    if (!saboresPorCat[cid]) saboresPorCat[cid] = [];
    saboresPorCat[cid].push(s);
  });

  // Produtos por categoria
  const produtosPorCat = {};
  produtos.forEach(p => {
    const cid = p.categoria_id || 'sem';
    if (!produtosPorCat[cid]) produtosPorCat[cid] = [];
    produtosPorCat[cid].push(p);
  });

  // HTML do header
  let html = `
    <div class="header">
      <div class="header-logo">
        ${neg.logo_url ? `<img src="${neg.logo_url}" alt="Logo">` : '🍴'}
      </div>
      <h1>${neg.nome}</h1>
      ${neg.endereco ? `<div class="header-endereco">📍 ${neg.endereco}</div>` : ''}
      <div class="status-aberto ${aberto ? '' : 'status-fechado'}">
        ${aberto ? 'Aberto agora' : 'Fechado no momento'}
      </div>
    </div>
  `;

  // Nav de categorias
  html += `<div class="cats-nav" id="cats-nav">`;
  categorias.forEach(c => {
    html += `<button class="cat-btn" onclick="scrollParaCat('${c.id}')">${c.nome}</button>`;
  });
  html += '</div>';

  // Aviso se fechado
  if (!aberto) {
    const dias = ['dom','seg','ter','qua','qui','sex','sab'];
    const h = neg.horarios || {};
    const hoje = dias[new Date().getDay()];
    const hoj = h[hoje];
    html += `
      <div class="fechado-banner">
        ⏰ Estamos fechados agora.<br>
        ${hoj?.ativo ? `Hoje abrimos às ${hoj.abre}.` : 'Não funcionamos hoje.'}
      </div>
    `;
  }

  // Seções por categoria
  categorias.forEach(cat => {
    const itensNaCat = [
      ...(saboresPorCat[cat.id] || []),
      ...(produtosPorCat[cat.id] || [])
    ];
    if (!itensNaCat.length) return;

    html += `<div class="secao" id="cat-${cat.id}">`;
    html += `<div class="secao-titulo">${cat.icone || ''} ${cat.nome}</div>`;

    itensNaCat.forEach(item => {
      const disponivel = item.disponivel;
      html += `<div class="item-card ${disponivel ? '' : 'item-indisponivel'}">`;
      html += `<div class="item-info">`;
      html += `<div class="item-nome">${item.nome}</div>`;
      if (item.descricao) html += `<div class="item-desc">${item.descricao}</div>`;

      // Se tem tamanhos (sabor de pizza), mostra preços por tamanho
      if (modulos.tamanhos && tamanhos.length && item.categoria_id !== null) {
        html += `<div class="tamanhos-lista">`;
        // Nota: idealmente viria precos_sabor_tamanho — aqui mostra só os tamanhos como referência
        tamanhos.forEach(t => {
          html += `<div class="tamanho-row"><span>${t.nome} (${t.fatias} fatias)</span><span>sob consulta</span></div>`;
        });
        html += `</div>`;
      } else if (item.preco) {
        html += `<div class="item-preco">${formatarPreco(item.preco)}</div>`;
      }

      html += '</div></div>';
    });

    html += '</div>';
  });

  // Bordas
  if (bordas.length && modulos.bordas) {
    html += `
      <div class="secao" id="cat-bordas">
        <div class="secao-titulo">🫕 Bordas Recheadas</div>
        ${bordas.filter(b => b.disponivel).map(b => `
          <div class="item-card">
            <div class="item-info">
              <div class="item-nome">${b.nome}</div>
              <div class="item-preco">${b.preco_adicional > 0 ? '+' + formatarPreco(b.preco_adicional) : 'Grátis'}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  // CTA WhatsApp
  const numero = neg.whatsapp_numero ? neg.whatsapp_numero.replace(/\D/g, '') : '';
  const msg = encodeURIComponent(`Olá! Vi o cardápio e quero fazer um pedido 🍕`);
  const linkWpp = numero ? `https://wa.me/${numero}?text=${msg}` : '#';

  html += `
    <div class="cta-bar">
      <a class="btn-whatsapp" href="${linkWpp}" target="_blank" rel="noopener">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Pedir pelo WhatsApp
      </a>
      <div class="cta-info">
        ${neg.formas_pagamento ? '💳 ' + neg.formas_pagamento : ''}
        ${neg.tempo_estimado_entrega ? ' · ⏱ Entrega em ' + neg.tempo_estimado_entrega : ''}
      </div>
    </div>
  `;

  document.getElementById('conteudo').innerHTML = html;

  // Ativa primeiro item do nav
  const primeiroCat = document.querySelector('.cat-btn');
  if (primeiroCat) primeiroCat.classList.add('ativo');

  // Scroll spy
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const id = e.target.id.replace('cat-', '');
        document.querySelectorAll('.cat-btn').forEach(b => {
          const onclick = b.getAttribute('onclick') || '';
          b.classList.toggle('ativo', onclick.includes(id));
        });
      }
    });
  }, { threshold: 0.3 });

  document.querySelectorAll('.secao').forEach(s => observer.observe(s));
}

function scrollParaCat(id) {
  const el = document.getElementById('cat-' + id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

main();
</script>
</body>
</html>
